<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__center">
        <div class="header__left">
          <img class="icon1" src="img/logo.png" alt="" />
          <img class="icon2" src="img/search.png" alt="" />
        </div>

        <div class="header__right">
          <img class="icon3" src="img/lines.png" alt="" />
          <img class="icon4" src="img/chel.png" alt="" />
          <img class="icon5" src="img/cart.png" alt="" />
        </div>
      </div>
    </header>
    <main class="main1">
      <section class="section__hero">
        <div class="hero_center">
          <div class="hero_left">
            <img class="hero_img" src="img/man.png" alt="" />
          </div>
          <div class="hero_right">
           
            <p class="hero_p_big">THE BRAND</p>
            <p class="hero_p_small">OF LUXERIOUS <span>FASHION</span></p>
          </div>
        </div>
      </section>
      <section class="section__offer">
        <div class="offer_center">
          <div class="offer_row">
            <div class="offer_low1"></div>
            <div class="offer_low2"></div>
            <div class="offer_low3"></div>
          </div>
          <div class="offer_big"></div>
        </div>
        
      </section>
      <section class="section__products"></section>
      <section class="section__feature"></section>
    </main>
    <footer class="footer">
      <section class="footer__subscribe"></section>
      <div class="footer__bottom"></div>
    </footer>
  </body>
</html>
