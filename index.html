<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__center">
        <div class="header__left">
          <img class="icon1" src="img/logo.png" alt="" />
          <img class="icon2" src="img/search.png" alt="" />
        </div>

        <div class="header__right">
          <img class="icon3" src="img/lines.png" alt="" />
          <img class="icon4" src="img/chel.png" alt="" />
          <img class="icon5" src="img/cart.png" alt="" />
        </div>
      </div>
    </header>
    <main class="main1">
      <section class="section__hero">
        <div class="hero_center">
          <div class="hero_left">
            <img class="hero_img" src="img/man.png" alt="" />
          </div>
          <div class="hero_right">
            <p class="hero_p_big">THE BRAND</p>
            <p class="hero_p_small">OF LUXERIOUS <span>FASHION</span></p>
          </div>
        </div>
      </section>
      <section class="section__offer">
        <div class="offer_center">
          <div class="offer_row">
            <div class="offer_low1">
              <p class="offer1_txt">30% OFF <br /><span>FOR WOMEN</span></p>
            </div>
            <div class="offer_low2">
              <p class="offer2_txt">HOT DEAL <br /><span>FOR MEN</span></p>
            </div>
            <div class="offer_low3">
              <p class="offer3_txt">NEW ARRIVALS <br /><span>FOR KIDS</span></p>
            </div>
          </div>
          <div class="offer_big">
            <p class="offer4_txt">
              LUXIROUS & TRENDY <br /><span>ACCESORIES</span>
            </p>
          </div>
        </div>
      </section>
      <div class="fetured_items">
        <p class="text_fetured_items">
          Fetured Items <br />
          <span> Shop for items based on what we featured in this week</span>
        </p>
      </div>
        <div class="fetured_items_center">
          <div class="fetured_items_row">
            <div class="row1"></div>
            <div class="row2"></div>
            <div class="row3"></div>
          </div>
          
        </div>
        <div class="txtblock_for_people">
          <p></p>
        </div>
      <section class="section__feature"></section>
      <section class="section__products"></section>
    </main>
    <footer class="footer">
      <section class="footer__subscribe"></section>
      <div class="footer__bottom"></div>
    </footer>
  </body>
</html>
